function cgFit(){
  const st = document.getElementById("cgstage"); if(!st) return;
  const sz = cgSize(), maxH = Math.max(320, window.innerHeight*.74);
  st.style.maxWidth = Math.min(760, maxH*sz.w/sz.h) + "px";
  const note = document.getElementById("cgsizenote");
  if(note) note.textContent = sz.name + " · " + sz.note.split(" · ")[0];
}
function cgSelectedObj(){ const c = S.collage; return c.sel && c.sel.t==="obj" ? c.objs.find(o=>o.id===c.sel.id) : null; }

async function cgDownload(type){
  const c = S.collage, sz = cgSize();
  toast("Building your picture…", 1500);
  await cgLoadAll();
  const cv = document.createElement("canvas"); cv.width = sz.w; cv.height = sz.h;
  cgDraw(cv.getContext("2d"), sz.w, sz.h, false);
  const mime = type==="png" ? "image/png" : "image/jpeg";
  const blob = await new Promise(r=>cv.toBlob(r, mime, .92));
  if(!blob){ toast("Couldn't build the picture. Try again.", 5000); return; }
  const fv = cgFV();
  const filename = slugify(fv ? [carName(fv), fv.trim, "facebook"].filter(Boolean).join(" ") : "hotshots-facebook") + "-" + sz.k + "." + (type==="png" ? "png" : "jpg");
  const dl = window.claude ? await claude.use("downloads").catch(()=>null) : null;
  try{
    if(dl){ await dl.save({filename, data:blob}); }
    else{
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
    }
    toast("Saved " + filename);
  }catch(e){ toast("Couldn't save that picture. Try again.", 5000); }
}

function wireCollage(){
  cgInit();
  const c = S.collage, root = document.getElementById("cgroot"), cv = document.getElementById("cgcanvas");
  if(!root || !cv) return;
  cgFit(); cgRenderSide(); cgRenderSel(); cgRedraw();
  Promise.all(['700 40px Fraunces','italic 600 40px Fraunces','500 40px Inter','800 40px Inter'].map(f=>document.fonts.load(f))).then(cgSchedule).catch(()=>{});

  root.addEventListener("click", e=>{
    const b = e.target.closest("[data-cg]"); if(!b) return;
    const [a, ...rest] = b.getAttribute("data-cg").split(":"), arg = rest.join(":");
    if(a==="dlj") cgDownload("jpg");
    else if(a==="dlp") cgDownload("png");
    else if(a==="size"){ c.size = arg; cgFit(); cgRenderSide(); cgSchedule(); }
    else if(a==="layout"){ c.layout = arg; cgFillSlots(false); if(c.sel && c.sel.t==="slot" && c.sel.i>=cgLayout().n) c.sel = {t:"slot",i:0}; cgRenderSide(); cgRenderSel(); cgSchedule(); }
    else if(a==="look"){ cgLook(arg); cgRenderSide(); cgRenderSel(); cgSchedule(); }
    else if(a==="lineup"){ cgBuildLineup(arg); cgRenderSide(); cgRenderSel(); cgSchedule(); }
    else if(a==="info"){ c.info = arg; cgRenderSide(); cgSchedule(); }
    else if(a==="bgc"){ c.bg = arg; cgRenderSide(); cgSchedule(); }
    else if(a==="sticker"){ cgAddSticker(+arg); cgRenderSel(); cgRenderSide(); cgSchedule(); }
    else if(a==="emoji"){ cgNewObj({text:CG_EMOJI[+arg], font:"emoji", size:.12, shadow:true, weight:500, x:.5, y:.45}); cgRenderSel(); cgRenderSide(); cgSchedule(); }
    else if(a==="addtext"){ cgNewObj({text:"Your text", size:.07, y:.5}); cgRenderSel(); cgRenderSide(); cgSchedule(); }
    else if(a==="photo"){
      const n = cgLayout().n;
      let i = c.sel && c.sel.t==="slot" ? c.sel.i : c.slots.slice(0,n).findIndex(s=>!s.key);
      if(i<0 || i>=n) i = 0;
      const s = c.slots[i]; s.key = arg; s.fx = .5; s.fy = .5; s.z = 1;
      c.sel = {t:"slot", i:(i+1)%n};
      cgRenderSide(); cgRenderSel(); cgSchedule();
    }
    else if(a==="upload"){ const f = document.getElementById("cgfile"); if(f) f.click(); }
    else if(a==="clearlocal"){ c.local = []; c.slots.forEach(s=>{ if(s.key && s.key.startsWith("l:")) s.key = null; }); cgRenderSide(); cgRenderSel(); cgSchedule(); }
    else if(a==="refill"){ cgFillSlots(true); cgRenderSide(); cgRenderSel(); cgSchedule(); }
    else if(a==="restart"){ if(confirm("Remove all text and stickers and reset the layout?")){ c.objs = []; c.layout = "h2"; c.gap = 8; c.margin = 0; c.radius = 0; c.bg = "#0b0c0e"; c.info = "bar"; c.frame = false; cgFillSlots(true); c.sel = {t:"slot",i:0}; cgRenderSide(); cgRenderSel(); cgSchedule(); } }
    else if(a==="dup"){ const o = cgSelectedObj(); if(o){ cgNewObj(Object.assign({}, o, {x:Math.min(.95,o.x+.04), y:Math.min(.95,o.y+.04)})); cgRenderSel(); cgSchedule(); } }
    else if(a==="front"){ const o = cgSelectedObj(); if(o){ c.objs = c.objs.filter(x=>x!==o).concat(o); cgSchedule(); } }
    else if(a==="del"){ const o = cgSelectedObj(); if(o){ c.objs = c.objs.filter(x=>x!==o); c.sel = null; cgRenderSel(); cgRenderSide(); cgSchedule(); } }
    else if(a==="slotreset"){ const s = c.slots[c.sel.i]; s.fx = .5; s.fy = .5; s.z = 1; cgRenderSel(); cgSchedule(); }
    else if(a==="slotclear"){ c.slots[c.sel.i].key = null; cgRenderSel(); cgRenderSide(); cgSchedule(); }
  });
  root.addEventListener("change", e=>{
    const t = e.target, k = t.getAttribute("data-cgs"); if(!k) return;
    if(k==="vid"){
      c.vid = t.value;
      if(t.value){ c.srcVid = t.value; cgFillSlots(true); }
      cgRenderSide(); cgSchedule();
    }
    if(k==="src"){ c.srcVid = t.value; cgFillSlots(true); cgRenderSide(); cgRenderSel(); cgSchedule(); }
  });
  root.addEventListener("input", e=>{
    const t = e.target, key = t.getAttribute("data-cgi"); if(!key) return;
    const val = t.type==="checkbox" ? t.checked : t.type==="range" ? parseFloat(t.value) : t.value;
    const [scope, prop] = key.split(":");
    if(scope==="g"){ c[prop] = val; }
    else if(scope==="o"){
      const o = cgSelectedObj(); if(!o) return;
      o[prop] = (prop==="weight") ? +val : val;
      if(prop==="font" && val==="emoji") o.weight = 500;
    }
    else if(scope==="s"){ const s = c.slots[c.sel.i]; if(s) s[prop] = val; }
    if(t.type==="range"){ const sp = t.parentElement.querySelector(".cgv"); if(sp) sp.textContent = Math.round(val*1000)/1000; }
    cgSchedule();
  });

  const pos = e => { const r = cv.getBoundingClientRect(); return {x:(e.clientX-r.left)*cv.width/r.width, y:(e.clientY-r.top)*cv.height/r.height}; };
  cv.addEventListener("pointerdown", e=>{
    const p = pos(e), W = cv.width, H = cv.height;
    for(let i=c.objs.length-1;i>=0;i--){
      const o = c.objs[i]; if(o._hw==null) continue;
      const a = -o.rot*Math.PI/180, dx = p.x-o.x*W, dy = p.y-o.y*H;
      const lx = dx*Math.cos(a) - dy*Math.sin(a), ly = dx*Math.sin(a) + dy*Math.cos(a);
      if(Math.abs(lx)<=o._hw && Math.abs(ly)<=o._hh){
        c.sel = {t:"obj", id:o.id};
        cgDrag = {t:"obj", o, ox:o.x*W-p.x, oy:o.y*H-p.y, id:e.pointerId};
        cv.setPointerCapture(e.pointerId); cgRenderSel(); cgSchedule(); return;
      }
    }
    const rects = c._rects || [], n = cgLayout().n;
    for(let i=0;i<n;i++){
      const r = rects[i]; if(!r) continue;
      if(p.x>=r.x && p.x<=r.x+r.w && p.y>=r.y && p.y<=r.y+r.h){
        c.sel = {t:"slot", i};
        const s = c.slots[i];
        cgDrag = {t:"slot", i, sx:p.x, sy:p.y, fx:s.fx, fy:s.fy, id:e.pointerId};
        cv.setPointerCapture(e.pointerId); cgRenderSel(); cgRenderSide(); cgSchedule(); return;
      }
    }
    c.sel = null; cgRenderSel(); cgRenderSide(); cgSchedule();
  });
  cv.addEventListener("pointermove", e=>{
    if(!cgDrag || cgDrag.id!==e.pointerId) return;
    const p = pos(e), W = cv.width, H = cv.height;
    if(cgDrag.t==="obj"){
      cgDrag.o.x = Math.max(0, Math.min(1, (p.x+cgDrag.ox)/W));
      cgDrag.o.y = Math.max(0, Math.min(1, (p.y+cgDrag.oy)/H));
    }else{
      const s = c.slots[cgDrag.i], r = c._rects[cgDrag.i], img = cgImg(s.key);
      if(!img) return;
      const d = cgCoverDims(img, r.w, r.h, s.z), rx = r.w-d.dw, ry = r.h-d.dh;
      if(rx) s.fx = Math.max(0, Math.min(1, cgDrag.fx + (p.x-cgDrag.sx)/rx));
      if(ry) s.fy = Math.max(0, Math.min(1, cgDrag.fy + (p.y-cgDrag.sy)/ry));
    }
    cgSchedule();
  });
  const end = e=>{ if(cgDrag && cgDrag.id===e.pointerId) cgDrag = null; };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);

  if(!cgBound){
    cgBound = true;
    window.addEventListener("resize", ()=>{ if(S.admin && S.admin.tab==="collage") cgFit(); });
    document.addEventListener("keydown", e=>{
      if(!S.admin || S.admin.tab!=="collage" || !S.collage) return;
      if(/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName||"")) return;
      const o = cgSelectedObj(); if(!o) return;
      if(e.key==="Delete" || e.key==="Backspace"){ S.collage.objs = S.collage.objs.filter(x=>x!==o); S.collage.sel = null; cgRenderSel(); cgSchedule(); e.preventDefault(); }
      const st = e.shiftKey ? .02 : .005;
      if(e.key==="ArrowLeft"){ o.x -= st; cgSchedule(); e.preventDefault(); }
      if(e.key==="ArrowRight"){ o.x += st; cgSchedule(); e.preventDefault(); }
      if(e.key==="ArrowUp"){ o.y -= st; cgSchedule(); e.preventDefault(); }
      if(e.key==="ArrowDown"){ o.y += st; cgSchedule(); e.preventDefault(); }
    });
  }
}

/* ---------- admin wiring ---------- */
function wireAdmin(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{
    if(S.admin.dirty && !confirm("Leave this vehicle without saving?")) return;
    S.admin.tab = b.getAttribute("data-tab"); S.admin.draft=null; S.admin.dirty=false;
    if(S.admin.tab==="storage") refreshUsage().then(render); else render();
  }));
  document.querySelectorAll("[data-admin]").forEach(b=>b.addEventListener("click", async ()=>{
    const a = b.getAttribute("data-admin");
    if(a==="close") closeAdmin();
    if(a==="new"){ S.admin.draft = blankVehicle(); S.admin.dirty=false; render(); }
    if(a==="cancel"){
      if(S.admin.dirty && !confirm("Discard changes to this vehicle?")) return;
      S.admin.draft=null; S.admin.dirty=false; render();
    }
    if(a==="save"){ await commitVehicle(); }
    if(a==="save-site"){ await commitSite(); }
    if(a==="favpick"){ const f = document.getElementById("favfile"); if(f) f.click(); }
    if(a==="favclear"){ delete S.settings.faviconAsset; await commitSite(); render(); }
    if(a==="export"){ await exportSite(); }
    if(a==="renamephotos"){ if(S.admin.draft) renameAllPhotosForSEO(S.admin.draft); }
    if(a==="build-embed" || a==="rebuild-embed"){
      const bb = document.getElementById("embedbtn"); if(bb) bb.disabled = true;
      const includePhotos = document.getElementById("embedphotos") ? document.getElementById("embedphotos").checked : true;
      try{
        S.admin.embedResult = await buildEmbedSnippet(includePhotos);
        render();
        toast("Embed code ready. Copy it into GoDaddy's Custom HTML section.");
      }catch(e){
        toast("Couldn't build the embed code. Try again in a moment.", 5000);
      }finally{ if(bb) bb.disabled = false; }
    }
    if(a==="copy-embed" && S.admin.embedResult){
      const code = S.admin.embedResult.code;
      try{
        await navigator.clipboard.writeText(code);
        toast("Copied. Paste it into GoDaddy's Custom Code field.");
      }catch(e){
        const ta = document.getElementById("embedcode");
        if(ta){ ta.focus(); ta.select(); }
        toast("Couldn't copy automatically — the box is selected, use Ctrl/Cmd+C.", 5000);
      }
    }
    if(a==="download-embed" && S.admin.embedResult){
      const dl = window.claude ? await claude.use("downloads").catch(()=>null) : null;
      if(!dl){ toast("Saving files isn't available in this view.", 5000); }
      else{
        const blob = new Blob([S.admin.embedResult.code], {type:"text/plain"});
        try{ await dl.save({filename:"godaddy-embed-code.txt", data:blob}); toast("Saved. Open it and copy everything into GoDaddy."); }
        catch(e){ toast("Couldn't save that file. Try again.", 5000); }
      }
    }
    if(a==="reset-manifest"){
      if(confirm("Forget the last build? The next build will repack every photo and document from scratch.")){
        clearManifest(); render();
      }
    }
  }));
  const invf = document.getElementById("invfilter");
  if(invf) invf.addEventListener("change", ()=>{ S.admin.invFilter = invf.value; render(); });
  document.querySelectorAll("[data-statusrow]").forEach(sel=>sel.addEventListener("change", async ()=>{
    const v = S.vehicles.find(x=>x.id===sel.getAttribute("data-statusrow"));
    if(!v) return;
    const prev = v.status;
    v.status = sel.value;
    if(v.status==="sold") v.soldAt = Date.now(); else delete v.soldAt;
    sel.disabled = true;
    try{
      await saveVehicle(v);
      toast(v.status==="sold" ? `${carName(v)} marked sold — now on the Sold Vehicles page.` : `${carName(v)} marked ${STATUSES[v.status].toLowerCase()}.`);
    }catch(e){
      v.status = prev; toast("Couldn't update that listing. Try again.");
    }
    render();
  }));
  document.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>{
    const v = S.vehicles.find(x=>x.id===b.getAttribute("data-edit"));
    if(!v) return;
    S.admin.draft = JSON.parse(JSON.stringify(v)); S.admin.dirty=false; render();
  }));
  document.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click", async ()=>{
    const v = S.vehicles.find(x=>x.id===b.getAttribute("data-del"));
    if(!v) return;
    if(!confirm(`Delete ${carName(v)}? Its photos and documents stay in storage but the listing is gone.`)) return;
    try{ await deleteVehicle(v.id); toast("Listing deleted."); }
    catch(e){ toast("Couldn't delete that listing. Try again."); }
    render();
  }));

  if(!S.admin.draft && S.admin.tab==="collage"){ wireCollage(); return; }
  if(!S.admin.draft){ wireSiteFields(); return; }
  const d = S.admin.draft;

  document.querySelectorAll("[data-k]").forEach(el=>{
    el.addEventListener("input", ()=>{
      const k = el.getAttribute("data-k");
      if(k==="features") d.features = el.value.split("\n").map(s=>s.trim()).filter(Boolean);
      else if(k==="price"||k==="mileage"||k==="kbbValue") d[k] = num(el.value);
      else d[k] = el.value;
      if(k==="kbbValue" && d.kbbValue!=null && !d.kbbDate){
        const t = new Date(), pad = n=>String(n).padStart(2,"0");
        d.kbbDate = t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate());
        const di = document.getElementById("f_kbbDate"); if(di) di.value = d.kbbDate;
      }
      if(!S.admin.dirty){ S.admin.dirty = true; const m=document.querySelector(".savebar .msg"); if(m) m.textContent="Unsaved changes"; }
    });
    el.addEventListener("change", ()=>{ if(el.tagName==="SELECT"){ d[el.getAttribute("data-k")] = el.value; S.admin.dirty=true; } });
  });

  setupDrop("#photodrop", "#photoinput", files => addPhotos(d, files));
  setupDrop("#docdrop", "#docinput", files => addDocs(d, files));
  wirePhotoGrid(d);

  document.querySelectorAll("[data-ddel]").forEach(b=>b.addEventListener("click",()=>{
    d.docs.splice(Number(b.getAttribute("data-ddel")),1); S.admin.dirty=true; render();
  }));
}

function wireSiteFields(){
  const ff = document.getElementById("favfile");
  if(ff) ff.addEventListener("change", async ()=>{
    const file = ff.files[0]; ff.value = ""; if(!file) return;
    try{
      const bmp = await createImageBitmap(file);
      const cv = document.createElement("canvas"); cv.width = cv.height = 256;
      const sc = Math.min(256/bmp.width, 256/bmp.height);
      cv.getContext("2d").drawImage(bmp, (256-bmp.width*sc)/2, (256-bmp.height*sc)/2, bmp.width*sc, bmp.height*sc);
      const png = await new Promise(r=>cv.toBlob(r,"image/png"));
      let id;
      if(S.assets){ id = (await S.assets.upload(png, {type:"image/png"})).id; }
      else{ id = "local:" + uid(); S.localBlobs.set(id, URL.createObjectURL(png)); }
      S.settings.faviconAsset = id;
      await commitSite(); render();
    }catch(e){ toast("Couldn't read that image. Use a PNG or JPG.", 5000); }
  });
  document.querySelectorAll("[data-s]").forEach(el=>{
    el.addEventListener("input", ()=>{ S.settings[el.getAttribute("data-s")] = el.value; });
  });
}

function setupDrop(dropSel, inputSel, handler){
  const drop = document.querySelector(dropSel), input = document.querySelector(inputSel);
  if(!drop || !input) return;
  drop.addEventListener("click", ()=> input.click());
  input.addEventListener("change", ()=>{ if(input.files.length) handler([...input.files]); input.value=""; });
  ["dragenter","dragover"].forEach(e=>drop.addEventListener(e, ev=>{ ev.preventDefault(); drop.classList.add("over"); }));
  ["dragleave","drop"].forEach(e=>drop.addEventListener(e, ev=>{ ev.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", ev=>{
    const files = [...(ev.dataTransfer?ev.dataTransfer.files:[])];
    if(files.length) handler(files);
  });
}

async function addPhotos(d, files){
  const imgs = files.filter(f=>/^image\//.test(f.type));
  if(!imgs.length){ toast("Those aren't image files. Photos need to be JPG, PNG or WebP."); return; }
  toast(`Uploading ${imgs.length} photo${imgs.length>1?"s":""}…`, 60000);
  let ok = 0;
  for(const file of imgs){
    try{ const a = await uploadFile(file, {maxDim:2400}); d.photos.push({id:a.id, name:a.name}); ok++; }
    catch(e){ toast(UPLOAD_ERRORS[e && e.code] || `Couldn't upload ${file.name}.`, 5000); }
  }
  S.admin.dirty = true;
  render();
  if(ok) toast(`${ok} photo${ok>1?"s":""} added. Save the vehicle to publish them.`);
  if(ok && S.sample) renameAllPhotosForSEO(d);
}

async function addDocs(d, files){
  const kindEl = document.querySelector("#dockind"), labelEl = document.querySelector("#doclabel");
  const kind = kindEl ? kindEl.value : "other";
  const label = labelEl && labelEl.value.trim() ? labelEl.value.trim() : "";
  toast(`Uploading ${files.length} file${files.length>1?"s":""}…`, 60000);
  let ok = 0;
  for(const file of files){
    if(!/pdf|^image\//.test(file.type)){ toast(`${file.name} isn't a PDF or image.`, 5000); continue; }
    try{
      const a = await uploadFile(file, {maxDim:2600});
      d.docs.push({id:a.id, name:a.name, kind, label, contentType:a.contentType, size:a.size});
      ok++;
    }catch(e){ toast(UPLOAD_ERRORS[e && e.code] || `Couldn't upload ${file.name}.`, 5000); }
  }
  S.admin.dirty = true;
  render();
  if(ok) toast(`${ok} document${ok>1?"s":""} attached. Save the vehicle to publish them.`);
}

async function commitVehicle(){
  const d = S.admin.draft;
  if(!d.year && !d.make && !d.model){ toast("Give the vehicle at least a year, make or model first."); return; }
  S.admin.saving = true; render();
  try{
    await saveVehicle(d);
    S.admin.saving = false; S.admin.dirty = false; S.admin.draft = null;
    render();
    toast("Vehicle saved and live on the site.");
  }catch(e){
    S.admin.saving = false; render();
    toast(e && e.code==="invalid_argument"
      ? "That didn't save — the description may be too long, or you may not have edit access."
      : "Couldn't save right now. Try again in a moment.", 5000);
  }
}

async function commitSite(){
  try{ await saveSettings(S.settings); toast("Site details saved."); }
  catch(e){ toast("Couldn't save site details. Try again."); }
}

/* ============================ routing ============================ */
function readHash(){
  const m = /v=([A-Za-z0-9_-]+)/.exec(location.hash||"");
  if(m){ S.currentId = m[1]; S.view = "detail"; }
  else if(/^#?sold$/.test(location.hash||"")){
    S.view = "list"; S.currentId = null; S.filters = defaultFilters("sold");
  }
  else if(!location.hash && typeof window!=="undefined" && window.__LOT_OPEN_VIN__){
    // A per-VIN static page (built by Publish) sets this before the app
    // script runs, so a bare visit to /{VIN}/ opens straight to that vehicle.
    const vin = String(window.__LOT_OPEN_VIN__).trim().toUpperCase();
    const match = (S.vehicles||[]).find(v => (v.vin||"").trim().toUpperCase() === vin);
    if(match){ S.currentId = match.id; S.view = "detail"; }
    else { S.view = "list"; S.currentId = null; }
  }
  else { S.view = "list"; S.currentId = null; }
}
window.addEventListener("hashchange", ()=>{ readHash(); S.photoIndex=0; S.lightbox=false; render(); });
window.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ if(S.lightbox){ exitFullscreenIfActive(); S.lightbox=false; render(); } }
  if(S.view==="detail" && !S.admin){
    if(e.key==="ArrowRight"||e.key==="ArrowLeft"){
      const v = S.vehicles.find(x=>x.id===S.currentId); const n = v && (v.photos||[]).length;
      if(n>1){ S.photoIndex = e.key==="ArrowRight" ? (S.photoIndex+1)%n : (S.photoIndex-1+n)%n; render(); }
    }
  }
});

readHash();
render();
boot();

</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HotShots Automotive — Used vehicle inventory</title>
<meta name="description" content="Hand-picked for you">
<link rel="icon" href="https://hotshotsauto.com/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --paper:#ffffff;
  --wash:#eef1f5;
  --wash-2:#e3e8ef;
  --ink:#111820;
  --ink-2:#4d5b6b;
  --ink-3:#77869a;
  --line:#d4dbe4;
  --line-strong:#b6c1ce;
  --brand:#0d3b5c;
  --brand-hover:#15527d;
  --on-brand:#ffffff;
  --band:#0d3b5c;
  --band-ink:#e9f1f8;
  --signal:#a8202c;
  --stamp:#15653f;
  --stamp-bg:#e4f2ea;
  --warn:#8a5a00;
  --warn-bg:#fdf1d8;
  --shadow:0 1px 2px rgba(16,26,38,.08), 0 8px 20px -12px rgba(16,26,38,.25);
  --radius:4px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131a22;
    --wash:#0e141b;
    --wash-2:#1b242f;
    --ink:#e7edf4;
    --ink-2:#a3b1c1;
    --ink-3:#7d8b9c;
    --line:#2a3542;
    --line-strong:#3a4756;
    --brand:#2f7fb5;
    --brand-hover:#3d92cb;
    --on-brand:#06121c;
    --band:#0b1622;
    --band-ink:#dbe7f2;
    --signal:#ff8189;
    --stamp:#63c99a;
    --stamp-bg:#132a20;
    --warn:#e0b25e;
    --warn-bg:#2a2214;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 20px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --paper:#131a22;
  --wash:#0e141b;
  --wash-2:#1b242f;
  --ink:#e7edf4;
  --ink-2:#a3b1c1;
  --ink-3:#7d8b9c;
  --line:#2a3542;
  --line-strong:#3a4756;
  --brand:#2f7fb5;
  --brand-hover:#3d92cb;
  --on-brand:#06121c;
  --band:#0b1622;
  --band-ink:#dbe7f2;
  --signal:#ff8189;
  --stamp:#63c99a;
  --stamp-bg:#132a20;
  --warn:#e0b25e;
  --warn-bg:#2a2214;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 20px -12px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{
  background:var(--wash);
  color:var(--ink);
  font:400 15px/1.55 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
.disp{font-family:"Archivo Narrow","Inter",sans-serif;letter-spacing:.005em}

/* ---------- top bar ---------- */
.topbar{background:var(--band);color:var(--band-ink);position:sticky;top:0;z-index:40}
.topbar .wrap{display:flex;align-items:center;gap:18px;min-height:60px;flex-wrap:wrap}
.brandmark{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brandmark .nm{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:23px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brandmark .tg{font-size:12.5px;color:rgba(233,241,248,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar a.tel{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:19px;text-decoration:none;white-space:nowrap}
.topbar a.tel:hover{text-decoration:underline}
.ghostbtn{background:transparent;border:1px solid rgba(233,241,248,.4);color:inherit;border-radius:var(--radius);padding:7px 13px;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.ghostbtn:hover{background:rgba(255,255,255,.1)}

/* ---------- page head ---------- */
.pagehead{background:var(--paper);border-bottom:1px solid var(--line)}
.pagehead .wrap{padding-top:26px;padding-bottom:20px}
h1.title{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:clamp(28px,4.2vw,40px);line-height:1.05;margin:0 0 6px}
.subline{margin:0;color:var(--ink-2);max-width:62ch;font-size:15px}
.trustrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.trustchip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;background:var(--stamp-bg);color:var(--stamp);border:1px solid color-mix(in srgb,var(--stamp) 30%,transparent);border-radius:999px;padding:5px 12px}

/* ---------- services / perks band ---------- */
.perksband{background:var(--band);border-bottom:2px solid color-mix(in srgb,var(--band-ink) 18%,transparent);overflow-x:auto;-webkit-overflow-scrolling:touch}
.perksband::-webkit-scrollbar{display:none}
.perksband .wrap{display:flex;gap:26px;padding:10px 20px;white-space:nowrap}
.perkitem{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--band-ink);flex-shrink:0}
.perkitem .tick{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:10.5px;flex-shrink:0}

/* ---------- toolbar ---------- */
.toolbar{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:60px;z-index:30}
.toolbar .wrap{display:flex;align-items:center;gap:14px;min-height:54px;flex-wrap:wrap}
.count{font-family:"Archivo Narrow",sans-serif;font-weight:600;font-size:17px}
.count b{font-weight:700}
.toolbar .spacer{margin-left:auto}
.sortwrap{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2)}
select,input[type=text],input[type=number],input[type=search],textarea{
  background:var(--paper);border:1px solid var(--line-strong);border-radius:var(--radius);padding:8px 10px;width:100%;
}
select:hover{border-color:var(--brand)}
.sortwrap select{width:auto;min-width:210px}
.linkbtn{background:none;border:0;padding:0;color:var(--brand);font-size:13.5px;font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.filtertoggle{display:none}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:266px 1fr;gap:24px;align-items:start;padding:24px 0 60px}
.rail{position:sticky;top:128px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);max-height:calc(100vh - 150px);overflow:auto}
.fgroup{border-bottom:1px solid var(--line);padding:14px 16px}
.fgroup:last-child{border-bottom:0}
.fgroup h3{font-family:"Archivo Narrow",sans-serif;font-size:15px;font-weight:700;margin:0 0 10px}
.fgroup label.chk{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:14px;cursor:pointer}
.fgroup label.chk input{margin:0;accent-color:var(--brand)}
.fgroup .cnt{margin-left:auto;color:var(--ink-3);font-size:12.5px}
.rangerow{display:grid;grid-template-columns:1fr auto 1fr;gap:7px;align-items:center;color:var(--ink-3);font-size:13px}
.railhead{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--wash-2);position:sticky;top:0;z-index:2}
.railhead h2{font-family:"Archivo Narrow",sans-serif;font-size:16px;margin:0;font-weight:700}

/* ---------- grid + cards ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.shot{position:relative;aspect-ratio:4/3;background:var(--wash-2);cursor:pointer;border:0;padding:0;width:100%;display:block}
.shot img{width:100%;height:100%;object-fit:cover}
.shot .none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:13px}
.pill{position:absolute;bottom:8px;right:8px;background:rgba(10,18,26,.78);color:#fff;font-size:12px;font-weight:500;padding:3px 8px;border-radius:3px}
.statustag{position:absolute;top:0;left:0;font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:13px;letter-spacing:.04em;padding:5px 12px;color:#fff;background:var(--signal)}
.statustag.pending{background:#9a6b00}
.cardbody{padding:14px 15px 16px;display:flex;flex-direction:column;gap:11px;flex:1}
.cardtop{display:flex;gap:12px;align-items:flex-start}
.cartitle{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:19px;line-height:1.2;margin:0;flex:1;min-width:0}
.cartitle .trim{display:block;font-weight:500;font-size:14px;color:var(--ink-2);line-height:1.3}
.pricebox{text-align:right;flex-shrink:0}
.price{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:23px;line-height:1.1;color:var(--signal)}
.pricenote{font-size:11.5px;color:var(--ink-3)}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:3px 14px;font-size:13.2px;color:var(--ink-2);margin:0}
.specs div{display:flex;gap:5px;min-width:0}
.specs span{color:var(--ink-3);flex-shrink:0}
.specs b{font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.paperstrip{display:flex;flex-wrap:wrap;gap:6px;padding-top:2px}
.doctag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;border:1px solid var(--line-strong);border-radius:3px;padding:3px 8px;color:var(--ink-2);background:var(--wash)}
.doctag.on{border-color:color-mix(in srgb,var(--stamp) 45%,transparent);background:var(--stamp-bg);color:var(--stamp)}
.cardactions{display:flex;gap:8px;margin-top:auto;padding-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:var(--radius);border:1px solid var(--brand);background:var(--brand);color:var(--on-brand);font-weight:600;font-size:14px;padding:9px 14px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn.sec{background:transparent;color:var(--brand);}
.btn.sec:hover{background:color-mix(in srgb,var(--brand) 10%,transparent)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.danger{border-color:var(--signal);background:transparent;color:var(--signal)}
.btn.danger:hover{background:color-mix(in srgb,var(--signal) 12%,transparent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.cardactions .btn{flex:1}

.empty{background:var(--paper);border:1px dashed var(--line-strong);border-radius:var(--radius);padding:56px 28px;text-align:center;color:var(--ink-2)}
.empty h3{font-family:"Archivo Narrow",sans-serif;font-size:21px;margin:0 0 8px;color:var(--ink)}

/* ---------- detail ---------- */
.detail{padding:22px 0 70px}
.crumb{background:none;border:0;padding:0;color:var(--brand);font-weight:500;cursor:pointer;font-size:14px;margin-bottom:14px}
.dhead{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;margin-bottom:18px}
.dhead h1{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:clamp(26px,3.6vw,36px);line-height:1.08;margin:0}
.dhead .sub{color:var(--ink-2);font-size:14.5px;margin-top:5px}
.dhead .pricebox{margin-left:auto;text-align:right}
.dhead .price{font-size:34px}
.dgrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:26px;align-items:start}
.gallery{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.stage{position:relative;aspect-ratio:4/3;background:#0b1118;cursor:zoom-in}
.stage img{width:100%;height:100%;object-fit:contain}
.stage .none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#7d8b9c;font-size:14px}
.navarrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(10,18,26,.55);color:#fff;border:0;width:44px;height:56px;cursor:pointer;font-size:22px;line-height:1;border-radius:3px;transition:background .15s}
.navarrow:hover{background:rgba(10,18,26,.85)}
.navarrow.l{left:10px}.navarrow.r{right:10px}
.maxbtn{position:absolute;top:10px;right:10px;background:rgba(10,18,26,.55);color:#fff;border:0;width:38px;height:38px;border-radius:3px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.maxbtn:hover{background:rgba(10,18,26,.85)}
.stagecount{position:absolute;bottom:10px;left:10px;background:rgba(10,18,26,.6);color:#fff;font-size:12.5px;font-weight:500;padding:4px 9px;border-radius:99px}

/* medium-thumbnail slideshow strip, shared by inline gallery and lightbox */
.thumbs{display:flex;gap:9px;padding:12px;overflow-x:auto;background:var(--paper);scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.thumbs::-webkit-scrollbar{height:6px}
.thumbs::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:99px}
.thumbs button{flex:0 0 108px;height:80px;padding:0;border:0;border-radius:6px;overflow:hidden;background:var(--wash-2);cursor:pointer;position:relative;scroll-snap-align:center;box-shadow:0 1px 3px rgba(16,26,38,.15);transition:transform .15s ease, box-shadow .15s ease;opacity:.72}
.thumbs button:hover{opacity:1;transform:translateY(-2px)}
.thumbs button[aria-current="true"]{opacity:1;box-shadow:0 0 0 3px var(--brand), 0 6px 14px rgba(16,26,38,.3);transform:translateY(-2px)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs.on-dark{background:#0b1118}
.thumbs.on-dark::-webkit-scrollbar-thumb{background:#3a4756}
.thumbs.on-dark button{box-shadow:0 1px 3px rgba(0,0,0,.5)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:18px}
.panel h2{font-family:"Archivo Narrow",sans-serif;font-size:19px;font-weight:700;margin:0 0 12px}
.sidecol .panel{position:relative}
.sidecol .stick{position:sticky;top:130px}
.spectable{width:100%;border-collapse:collapse;font-size:14px}
.spectable td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.spectable tr:last-child td{border-bottom:0}
.spectable td:first-child{color:var(--ink-3);width:44%;padding-right:12px}
.prose{white-space:pre-wrap;line-height:1.65;max-width:72ch;color:var(--ink)}
ul.feat{columns:2;column-gap:26px;margin:0;padding-left:19px;font-size:14.2px}
ul.feat li{margin:0 0 4px;break-inside:avoid}
.doclist{display:flex;flex-direction:column;gap:9px}
.docrow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:var(--radius);padding:10px 13px;background:var(--wash);text-decoration:none}
.docrow:hover{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 7%,var(--wash))}
.docicon{flex:0 0 34px;height:40px;border-radius:2px;background:var(--paper);border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:11px;color:var(--ink-2)}
.docmeta{min-width:0;flex:1}
.docmeta .k{font-weight:600;font-size:14.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docmeta .s{font-size:12.3px;color:var(--ink-3)}
.docopen{font-size:13px;color:var(--brand);font-weight:500;flex-shrink:0}
.contactbox .line{display:flex;gap:9px;font-size:14px;padding:5px 0;color:var(--ink-2)}
.contactbox .line b{font-weight:500;color:var(--ink)}

/* ---------- lightbox ---------- */
.lightbox{position:fixed;inset:0;background:#0b1118;z-index:90;display:flex;flex-direction:column;touch-action:pan-y}
.lightbox:fullscreen{background:#0b1118}
.lbtopbar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-right,0px)) 10px calc(14px + env(safe-area-inset-left,0px));color:#cfd9e4;flex:0 0 auto}
.lbtopbar .maxbtn{position:static}
.lbstage{position:relative;flex:1;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;padding:0 calc(14px + env(safe-area-inset-right,0px)) 0 calc(14px + env(safe-area-inset-left,0px));touch-action:pan-y;overflow:hidden}
.lbstage img{max-width:100%;max-height:100%;object-fit:contain;-webkit-user-select:none;user-select:none;touch-action:pan-y;will-change:transform;cursor:zoom-in}
.lbstage.zoomed img{cursor:grab;touch-action:none}
.lbstage.zoomed img:active{cursor:grabbing}
.lbstage .navarrow{top:50%}
.lbhint{font-size:11.5px;color:rgba(207,217,228,.65);white-space:nowrap}
#lb-thumbs{flex:0 0 auto;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}

/* short/landscape viewports (phones rotated): stack the controls to the side
   instead of on top of and below the photo, since vertical room is scarce */
@media (orientation:landscape) and (max-height:560px){
  .lightbox{flex-direction:row}
  .lbtopbar{position:absolute;top:0;left:0;right:0;z-index:5;
    background:linear-gradient(180deg,rgba(6,11,16,.75),transparent);
    padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:22px}
  .lbstage{flex:1;min-height:0;padding:0}
  .lbstage .navarrow{width:38px;height:48px}
  #lb-thumbs{flex:0 0 92px;width:92px;height:100%;flex-direction:column;
    overflow-x:hidden;overflow-y:auto;scroll-snap-type:y proximity;
    padding:calc(52px + env(safe-area-inset-top,0px)) 8px calc(10px + env(safe-area-inset-bottom,0px)) 8px}
  #lb-thumbs button{flex:0 0 68px;width:100%;height:52px;scroll-snap-align:center}
}

/* ---------- admin ---------- */
.admin{position:fixed;inset:0;background:var(--wash);z-index:80;display:flex;flex-direction:column}
.adminbar{background:var(--band);color:var(--band-ink);display:flex;align-items:center;gap:14px;padding:11px 20px;flex-wrap:wrap}
.adminbar h2{font-family:"Archivo Narrow",sans-serif;font-size:19px;margin:0;font-weight:700}
.adminbar .tabs{display:flex;gap:4px;margin-left:12px}
.adminbar .tabs button{background:transparent;border:0;color:rgba(233,241,248,.72);padding:7px 12px;border-radius:3px;cursor:pointer;font-size:14px;font-weight:500}
.adminbar .tabs button[aria-current="true"]{background:rgba(255,255,255,.16);color:#fff}
.adminbody{flex:1;overflow:auto;padding:22px 20px 80px}
.adminbody .inner{max-width:960px;margin:0 auto}
.fieldgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:12.8px;font-weight:600;color:var(--ink-2)}
.hint{font-size:12px;color:var(--ink-3);margin:0}
.field.wide{grid-column:1/-1}
textarea{min-height:120px;resize:vertical;line-height:1.55}
.sectiontitle{font-family:"Archivo Narrow",sans-serif;font-size:17px;font-weight:700;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.drop{border:2px dashed var(--line-strong);border-radius:var(--radius);padding:24px;text-align:center;color:var(--ink-2);background:var(--wash);cursor:pointer}
.drop.over{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--wash))}
.drop b{display:block;font-size:15px;color:var(--ink);font-weight:600;margin-bottom:3px}
.drop small{font-size:12.5px;color:var(--ink-3)}
.photogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:11px;margin-top:14px}
.photocell{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--paper);position:relative;transition:transform .15s ease, box-shadow .15s ease}
.photocell .ph{aspect-ratio:4/3;background:var(--wash-2);position:relative}
.photocell .ph img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.photocell .draghandle{position:absolute;top:6px;left:6px;width:30px;height:26px;background:rgba(10,18,26,.65);color:#fff;border:0;border-radius:3px;cursor:grab;display:flex;align-items:center;justify-content:center;font-size:14px;letter-spacing:1px;touch-action:none;line-height:1}
.photocell .draghandle:active{cursor:grabbing}
.photocell.dragging{opacity:.35}
.photocell.drop-target{box-shadow:0 0 0 2px var(--brand) inset}
.photocell .seoname{font-size:10.5px;color:var(--ink-3);padding:5px 7px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.photocell .seoname.pending{color:var(--brand)}
.photocell .tools{display:flex;gap:3px;padding:6px;border-top:1px solid var(--line)}
.photocell .tools button{flex:1;background:var(--wash);border:1px solid var(--line);border-radius:3px;padding:4px;font-size:11.5px;cursor:pointer;color:var(--ink-2)}
.photocell .tools button:hover{border-color:var(--brand);color:var(--brand)}
.photocell .mainflag{font-size:11px;font-weight:600;color:var(--stamp);padding:5px 7px 0}
.dragghost{position:fixed;pointer-events:none;z-index:200;width:120px;aspect-ratio:4/3;border-radius:4px;overflow:hidden;box-shadow:0 10px 26px rgba(0,0,0,.4);opacity:.9}
.dragghost img{width:100%;height:100%;object-fit:cover}
.adminlist{display:flex;flex-direction:column;gap:10px}
.arow{display:flex;gap:13px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:10px 13px}
.arow .thumb{flex:0 0 76px;height:57px;border-radius:3px;overflow:hidden;background:var(--wash-2);display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:11px}
.arow .thumb img{width:100%;height:100%;object-fit:cover}
.arow .info{flex:1;min-width:0}
.arow .info .t{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:16.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .info .m{font-size:12.8px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .acts{display:flex;gap:7px;flex-shrink:0}
.statusdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--stamp);margin-right:6px;vertical-align:middle}
.statusdot.pending{background:#c08a00}
.statusdot.sold{background:var(--signal)}
.savebar{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:10px;align-items:center;margin:26px -20px -80px;box-shadow:0 -6px 18px -14px rgba(0,0,0,.5)}
.savebar .msg{font-size:13px;color:var(--ink-3);margin-left:auto}
.meter{height:8px;border-radius:99px;background:var(--wash-2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--brand)}
.notice{border:1px solid var(--line);border-left:3px solid var(--warn);background:var(--warn-bg);color:var(--warn);padding:11px 14px;border-radius:var(--radius);font-size:13.5px;margin-bottom:18px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:var(--radius);font-size:14px;z-index:120;box-shadow:var(--shadow);max-width:90vw}
.spin{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

footer.site{background:var(--band);color:var(--band-ink);padding:30px 0;margin-top:0}
footer.site .wrap{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;font-size:13.5px}
footer.site .nm{font-family:"Archivo Narrow",sans-serif;font-weight:700;font-size:19px;margin-bottom:5px}
footer.site .fine{color:rgba(233,241,248,.6);max-width:54ch;font-size:12.3px;line-height:1.5}

@media (max-width:1040px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .dgrid{grid-template-columns:1fr}
  .sidecol .stick{position:static}
}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;max-height:none;display:none}
  .rail.open{display:block}
  .filtertoggle{display:inline-flex}
  .toolbar{top:0;position:static}
}
@media (max-width:560px){
  .grid{grid-template-columns:1fr}
  .topbar .wrap{min-height:54px;padding-top:8px;padding-bottom:8px}
  ul.feat{columns:1}
  .dhead .pricebox{margin-left:0;text-align:left}
}

const miles = n => n==null ? "" : Number(n).toLocaleString("en-US") + " mi";
const kb = n => n<1024 ? n+" B" : n<1048576 ? (n/1024).toFixed(0)+" KB" : (n/1048576).toFixed(1)+" MB";
const uid = () => "v" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const STATIC = (typeof window !== "undefined" && window.__LOT_DATA__) ? window.__LOT_DATA__ : null;
const assetUrl = id => STATIC

const carName = v => [v.year, v.make, v.model].filter(Boolean).join(" ") || "Untitled vehicle";
function photoAlt(v, photo){
  const base = carName(v) + (v.trim?" "+v.trim:"");
  if(photo && photo.seoName){
    const words = photo.seoName.replace(/\.[a-z0-9]+$/i,"").split("-");
    const base_words = slugify(vehicleSlugBase(v)).split("-");
    const desc = words.slice(base_words.length, /^\d+$/.test(words[words.length-1]) ? words.length-1 : words.length).join(" ");
    if(desc) return `${base} — ${desc}`;
  }
  return base;
}
const docKind = k => DOC_KINDS.find(d=>d.k===k) || DOC_KINDS[DOC_KINDS.length-1];

function toast(msg, ms){
  const old = document.querySelector(".toast"); if(old) old.remove();
  const t = document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>{ if(t.parentNode) t.remove(); }, ms||3200);
}

function blankVehicle(){

/* ============================ storage layer ============================ */
async function boot(){
  if(STATIC){
    S.vehicles = STATIC.vehicles || [];
    S.settings = Object.assign({}, DEFAULT_SETTINGS, STATIC.settings || {});
    S.isAdmin = false; S.localMode = false; S.ready = true;
    render();
    return;
  }
  try{
    if(window.claude && typeof window.claude.use === "function"){
      const [db, assets, user, sample] = await Promise.all([
        claude.use("db").catch(()=>null),
        claude.use("assets").catch(()=>null),
        claude.use("user").catch(()=>null),
        claude.use("sample").catch(()=>null)
      ]);
      S.db = db || null;
      S.assets = assets || null;
      S.sample = sample || null;
      if(user){ try{ S.isAdmin = await user.canEdit(); }catch(e){ S.isAdmin = false; } }
      if(!S.isAdmin && S.assets) S.isAdmin = true; // assets is writer-only
    }
  }catch(e){ /* fall through to local mode */ }

  if(!S.db){
    S.localMode = true;
    S.isAdmin = true;
    S.ready = true;
    render();
    return;
  }

  S.db.doc("config/site").onSnapshot(snap=>{
    const d = (snap && snap.exists) ? snap.data() : null;
    S.settings = Object.assign({}, DEFAULT_SETTINGS, d || {});
    render();
  }, err=>{ console.warn("settings subscription ended", err); });

  S.db.collection("vehicles").onSnapshot(snap=>{
    const list = [];
    (snap.docs||[]).forEach(doc => { const d = doc.data(); if(d) list.push(Object.assign({id:doc.id}, d)); });
    S.vehicles = list;
    S.ready = true;
    render();
  }, err=>{
    S.ready = true;
    toast("Inventory could not load right now. Reload the page to try again.");
    render();
  });

  setTimeout(()=>{ if(!S.ready){ S.ready = true; render(); } }, 6000);
}

async function saveVehicle(v){
  v.updatedAt = Date.now();
  if(S.db){
    const {id, ...body} = v;
    await S.db.doc("vehicles/"+id).set(body);
  }else{
    const i = S.vehicles.findIndex(x=>x.id===v.id);
    if(i>=0) S.vehicles[i] = v; else S.vehicles.push(v);
    render();
  }
}
async function deleteVehicle(id){
  if(S.db){ await S.db.doc("vehicles/"+id).delete(); }
  else { S.vehicles = S.vehicles.filter(v=>v.id!==id); render(); }
}
async function saveSettings(s){
  S.settings = Object.assign({}, DEFAULT_SETTINGS, s);
  if(S.db){ await S.db.doc("config/site").set(S.settings); }
  else render();
}

/* image downscale before upload — keeps storage small and pages fast */
function shrinkImage(file, maxDim, quality){
  return new Promise((resolve)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, maxDim/Math.max(img.width, img.height));
      if(scale === 1 && file.size < 1200000){ URL.revokeObjectURL(url); return resolve(file); }
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      c.toBlob(b=>{ URL.revokeObjectURL(url); resolve(b && b.size < file.size ? b : file); }, "image/jpeg", quality);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

const UPLOAD_ERRORS = {
  too_large: "That file is over the 20 MB limit. Compress it or split it into parts.",

  store_unavailable: "Storage hiccuped. Try that file again."

async function uploadFile(file, opts){
  const isImage = /^image\//.test(file.type);
  let blob = file, type = file.type;
  if(isImage && file.type !== "image/svg+xml"){
    blob = await shrinkImage(file, (opts&&opts.maxDim)||2400, 0.82);
    if(blob !== file) type = "image/jpeg";
  }
  if(!S.assets){
    const id = "local:" + uid();
    S.localBlobs.set(id, URL.createObjectURL(blob));
    return {id, name:file.name, contentType:type||"application/octet-stream", size:blob.size};
  }
  const res = await S.assets.upload(blob, type ? {type} : undefined);
  return {id:res.id, name:file.name, contentType:res.contentType, size:res.sizeBytes};
}

async function refreshUsage(){
  if(!S.assets) return;
  try{ const r = await S.assets.list(); S.usage = r.usage; }catch(e){ S.usage = null; }
}

/* ============================ derived data ============================ */
function visibleVehicles(){

  const q = f.q.trim().toLowerCase();
  let list = S.vehicles.filter(v=>{
    if(f.status==="forsale" && v.status==="sold") return false;
    if(f.status==="sold" && v.status!=="sold") return false;
    if(f.makes.size && !f.makes.has(v.make||"—")) return false;
    if(f.bodies.size && !f.bodies.has(v.bodyStyle||"—")) return false;
    if(f.docs.size){
      const kinds = new Set((v.docs||[]).map(d=>d.kind));
      for(const k of f.docs){ if(!kinds.has(k)) return false; }
    }
    const p = num(v.price), m = num(v.mileage), y = num(v.year);
    if(f.priceMin!=="" && (p==null || p < Number(f.priceMin))) return false;
    if(f.priceMax!=="" && (p==null || p > Number(f.priceMax))) return false;
    if(f.milesMax!=="" && (m==null || m > Number(f.milesMax))) return false;
    if(f.yearMin!=="" && (y==null || y < Number(f.yearMin))) return false;
    if(f.yearMax!=="" && (y==null || y > Number(f.yearMax))) return false;
    if(q){
      const hay = [v.year,v.make,v.model,v.trim,v.vin,v.stock,v.extColor,v.headline,v.description]
        .filter(Boolean).join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
  const by = S.sort;
  const n = (x,d)=> x==null?d:Number(x);
  list.sort((a,b)=>{
    switch(by){
      case "oldest":   return (a.createdAt||0)-(b.createdAt||0);
      case "price_hi": return n(b.price,-1)-n(a.price,-1);
      case "price_lo": return n(a.price,Infinity)-n(b.price,Infinity);
      case "miles_lo": return n(a.mileage,Infinity)-n(b.mileage,Infinity);
      case "miles_hi": return n(b.mileage,-1)-n(a.mileage,-1);
      case "year_hi":  return n(b.year,-1)-n(a.year,-1);
      case "year_lo":  return n(a.year,Infinity)-n(b.year,Infinity);
      case "alpha":    return carName(a).localeCompare(carName(b));
      default:         return (b.createdAt||0)-(a.createdAt||0);
    }
  });
  return list;
}
function facet(field){
  const m = new Map();
  S.vehicles.forEach(v=>{ if(S.filters.status==="forsale" && v.status==="sold") return;
    const k = v[field] || "—"; m.set(k,(m.get(k)||0)+1); });
  return [...m.entries()].sort((a,b)=> a[0]==="—" ? 1 : b[0]==="—" ? -1 : a[0].localeCompare(b[0]));
}
function docFacet(){
  const m = new Map();
  S.vehicles.forEach(v=>{ if(S.filters.status==="forsale" && v.status==="sold") return;
    new Set((v.docs||[]).map(d=>d.kind)).forEach(k=> m.set(k,(m.get(k)||0)+1)); });
  return DOC_KINDS.filter(d=>m.has(d.k) && d.k!=="other").map(d=>[d, m.get(d.k)]);
}

/* ============================ render ============================ */
function render(){
  const app = $("#app");
  const scrollY = window.scrollY;
  if(S.admin){ app.innerHTML = viewAdmin(); wireAdmin(); return; }
  if(S.view === "detail"){
    const v = S.vehicles.find(x=>x.id===S.currentId);
    app.innerHTML = chrome(v ? viewDetail(v) : viewMissing());
    wireCommon();
    if(v) wireDetail(v);
    return;
  }
  app.innerHTML = chrome(viewList());
  wireCommon(); wireList();
  window.scrollTo(0, scrollY);
}

function card(v){

function docRow(d){

    <span class="docicon">${ext}</span>

      <span class="k">${esc(d.label || k.label)}</span>
      <span class="s">${esc(d.name||"")}${d.size?" · "+kb(d.size):""}</span>

function defaultFilters(status){
  return {q:"",makes:new Set(),bodies:new Set(),docs:new Set(),status:status||"forsale",
    priceMin:"",priceMax:"",yearMin:"",yearMax:"",milesMax:""};
}

/* ============================ wiring: public ============================ */
function wireCommon(){
  document.querySelectorAll("[data-act]").forEach(el=>{
    el.addEventListener("click", ev=>{
      const act = el.getAttribute("data-act");
      if(act==="open-admin"){ ev.preventDefault(); openAdmin(); }
      if(act==="back"){ S.view="list"; S.currentId=null; S.lightbox=false; location.hash=""; render(); window.scrollTo(0,0); }
      if(act==="reset-filters"){ S.filters = defaultFilters(); render(); }
      if(act==="view-sold"){
        S.view="list"; S.filters = defaultFilters("sold"); S.railOpen=false;
        location.hash = "sold"; render(); window.scrollTo(0,0);
      }
      if(act==="view-forsale"){
        S.view="list"; S.filters = defaultFilters("forsale"); S.railOpen=false;
        location.hash = ""; render(); window.scrollTo(0,0);
      }
      if(act==="toggle-rail"){ S.railOpen=!S.railOpen; render(); }
      if(act==="lightbox"){ if(!ev.target.closest("[data-photo],[data-act='maximize']")){ S.lightbox=true; render(); } }
      if(act==="maximize"){ ev.stopPropagation(); S.lightbox=true; S.requestFullscreenOnOpen=true; render(); }
      if(act==="close-lightbox"){ if(ev.target===el){ exitFullscreenIfActive(); S.lightbox=false; render(); } }
      if(act==="toggle-fullscreen"){ toggleFullscreen(); }
    });
  });
  document.querySelectorAll("[data-open]").forEach(el=>{
    el.addEventListener("click", ()=>{
      S.currentId = el.getAttribute("data-open"); S.view="detail"; S.photoIndex=0; S.lightbox=false;
      location.hash = "v=" + S.currentId;
      render(); window.scrollTo(0,0);
    });
  });
}

function wireList(){
  const sort = $("#sortsel");
  if(sort) sort.addEventListener("change", e=>{ S.sort = e.target.value; render(); });
  const q = $("#qbox");
  if(q) q.addEventListener("input", debounce(e=>{ S.filters.q = e.target.value; render(); restoreFocus("#qbox"); }, 280));
  document.querySelectorAll("[data-facet]").forEach(cb=>{
    cb.addEventListener("change", ()=>{
      const set = S.filters[cb.getAttribute("data-facet")];
      if(cb.checked) set.add(cb.value); else set.delete(cb.value);
      render();
    });
  });
  document.querySelectorAll('input[name="statusf"]').forEach(r=>{
    r.addEventListener("change", ()=>{ S.filters.status = r.value; render(); });
  });
  [["#pmin","priceMin"],["#pmax","priceMax"],["#mmax","milesMax"],["#ymin","yearMin"],["#ymax","yearMax"]]
    .forEach(([sel,key])=>{
      const el = $(sel); if(!el) return;
      el.addEventListener("input", debounce(()=>{ S.filters[key]=el.value; render(); restoreFocus(sel); }, 400));
    });
}

function wireDetail(v){
  document.querySelectorAll("[data-photo]").forEach(b=>{
    b.addEventListener("click", ev=>{
      ev.stopPropagation();
      const n = (v.photos||[]).length; if(!n) return;
      S.photoIndex = b.getAttribute("data-photo")==="next"
        ? (S.photoIndex+1)%n : (S.photoIndex-1+n)%n;
      render();
    });
  });
  document.querySelectorAll("[data-thumb]").forEach(b=>{
    b.addEventListener("click", ()=>{ S.photoIndex = Number(b.getAttribute("data-thumb")); render(); });
  });
  scrollActiveThumbIntoView("inline-thumbs");
  scrollActiveThumbIntoView("lb-thumbs");
  wireSwipe(".stage", v);
  wireZoom(v);
  if(S.lightbox && S.requestFullscreenOnOpen){
    S.requestFullscreenOnOpen = false;
    const el = document.getElementById("lightbox-root");
    if(el && el.requestFullscreen) el.requestFullscreen().catch(()=>{});
  }
}

function toggleFullscreen(){
  const el = document.getElementById("lightbox-root");
  if(!el) return;
  if(document.fullscreenElement){ document.exitFullscreen().catch(()=>{}); }
  else if(el.requestFullscreen){ el.requestFullscreen().catch(()=>{}); }
}
function exitFullscreenIfActive(){
  if(document.fullscreenElement && document.exitFullscreen){ document.exitFullscreen().catch(()=>{}); }
}
function wireSwipe(sel, v){
  const el = document.querySelector(sel);
  if(!el) return;
  let sx=null, sy=null, st=0;
  el.addEventListener("pointerdown", e=>{
    if(e.pointerType==="mouse") return;
    sx=e.clientX; sy=e.clientY; st=Date.now();
  }, {passive:true});
  el.addEventListener("pointerup", e=>{
    if(sx==null) return;
    const dx=e.clientX-sx, dy=e.clientY-sy, dt=Date.now()-st;
    sx=null;
    const n=(v.photos||[]).length;
    if(n>1 && dt<650 && Math.abs(dx)>44 && Math.abs(dx)>Math.abs(dy)*1.4){
      S.photoIndex = dx<0 ? (S.photoIndex+1)%n : (S.photoIndex-1+n)%n;
      render();
    }
  }, {passive:true});
}

/* Zoom + pan for the full-screen (lightbox) image. When not zoomed, a
   quick single-finger drag navigates to the next/previous photo, matching
   wireSwipe's behavior; once zoomed in, the same gesture pans instead. */
function wireZoom(v){
  if(!S.lightbox) return;
  const stage = document.querySelector(".lbstage");
  const img = stage && stage.querySelector("img");
  if(!stage || !img) return;

  const MAX_SCALE = 4;
  let scale = 1, tx = 0, ty = 0;
  const pointers = new Map();
  let pinchStart = null;   // {dist, scale, tx, ty, mid}
  let dragStart = null;    // {x, y, t, tx, ty}
  let lastTap = null;      // {x, y, t}

  function apply(smooth){
    img.style.transition = smooth ? "transform .18s ease" : "none";
    img.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
    stage.classList.toggle("zoomed", scale > 1.01);
  }
  function clampPan(){
    const r = stage.getBoundingClientRect();
    const maxX = (r.width*(scale-1))/2 + r.width*0.12;
    const maxY = (r.height*(scale-1))/2 + r.height*0.12;
    tx = Math.max(-maxX, Math.min(maxX, tx));
    ty = Math.max(-maxY, Math.min(maxY, ty));
  }
  function reset(smooth){ scale=1; tx=0; ty=0; apply(smooth); }
  function zoomAt(clientX, clientY, target){
    const r = img.getBoundingClientRect();
    const cx = clientX - (r.left + r.width/2), cy = clientY - (r.top + r.height/2);
    const ratio = target/scale;
    tx = tx*ratio - cx*(ratio-1);
    ty = ty*ratio - cy*(ratio-1);
    scale = target;
    clampPan();
    apply(true);
  }

  img.addEventListener("dblclick", e=>{
    e.preventDefault();
    scale > 1.01 ? reset(true) : zoomAt(e.clientX, e.clientY, 2.5);
  });

  img.addEventListener("pointerdown", e=>{
    try{ img.setPointerCapture(e.pointerId); }catch(err){}
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

    if(pointers.size === 2){
      const [a,b] = [...pointers.values()];
      pinchStart = {
        dist: Math.hypot(a.x-b.x, a.y-b.y), scale,
        tx, ty, mid: {x:(a.x+b.x)/2, y:(a.y+b.y)/2}
      };
      dragStart = null;
    }else if(pointers.size === 1){
      dragStart = {x:e.clientX, y:e.clientY, t:Date.now(), tx, ty};
      if(e.pointerType === "touch"){
        const now = Date.now();
        if(lastTap && now-lastTap.t < 320 && Math.hypot(e.clientX-lastTap.x, e.clientY-lastTap.y) < 30){
          scale > 1.01 ? reset(true) : zoomAt(e.clientX, e.clientY, 2.5);
          lastTap = null;
        }else{
          lastTap = {x:e.clientX, y:e.clientY, t:now};
        }
      }
    }
  });

  img.addEventListener("pointermove", e=>{
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

    if(pointers.size === 2 && pinchStart){
      const [a,b] = [...pointers.values()];
      const dist = Math.hypot(a.x-b.x, a.y-b.y);
      const mid = {x:(a.x+b.x)/2, y:(a.y+b.y)/2};
      scale = Math.max(1, Math.min(MAX_SCALE, pinchStart.scale * (dist/pinchStart.dist)));
      tx = pinchStart.tx + (mid.x - pinchStart.mid.x);
      ty = pinchStart.ty + (mid.y - pinchStart.mid.y);
      clampPan();
      apply(false);
    }else if(pointers.size === 1 && dragStart && scale > 1.01){
      tx = dragStart.tx + (e.clientX - dragStart.x);
      ty = dragStart.ty + (e.clientY - dragStart.y);
      clampPan();
      apply(false);
    }
  });

  function onUp(e){
    pointers.delete(e.pointerId);
    if(pointers.size === 0 && dragStart && scale <= 1.01){
      const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y, dt = Date.now() - dragStart.t;
      const n = (v.photos||[]).length;
      if(n > 1 && dt < 650 && Math.abs(dx) > 44 && Math.abs(dx) > Math.abs(dy)*1.4){
        S.photoIndex = dx < 0 ? (S.photoIndex+1)%n : (S.photoIndex-1+n)%n;
        render();
        return;
      }
    }
    dragStart = null;
    pinchStart = null;
    if(pointers.size === 0 && scale < 1.02) reset(false);
  }
  img.addEventListener("pointerup", onUp);
  img.addEventListener("pointercancel", onUp);

  img.addEventListener("wheel", e=>{
    e.preventDefault();
    const next = Math.max(1, Math.min(MAX_SCALE, scale * (e.deltaY < 0 ? 1.12 : 0.89)));
    zoomAt(e.clientX, e.clientY, next);
  }, {passive:false});
}

function scrollActiveThumbIntoView(containerId){
  const c = document.getElementById(containerId); if(!c) return;
  const active = c.querySelector('[aria-current="true"]'); if(!active) return;
  active.scrollIntoView({behavior:"smooth", inline:"center", block:"nearest"});
}

function restoreFocus(sel){
  const el = $(sel); if(!el) return;
  const v = el.value; el.focus(); try{ el.setSelectionRange(v.length, v.length); }catch(e){}
}
function debounce(fn, ms){ let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,a), ms); }; }

function embedResultHTML(r){
  const risky = r.bytes > 45000;
  const tight = !risky && r.bytes > 25000;
  const color = risky ? "var(--signal)" : tight ? "var(--warn)" : "var(--stamp)";
  const bg = risky ? "color-mix(in srgb,var(--signal) 12%,var(--wash))" : tight ? "var(--warn-bg)" : "var(--stamp-bg)";
  const verdict = risky
    ? " That's large for a text field like this — uncheck photos, or mark some older vehicles sold, then rebuild before pasting it in."
    : tight
    ? " That should fit, but it's not a lot of margin. If GoDaddy rejects it, uncheck photos and rebuild."
    : " Comfortably small — this should paste into GoDaddy without any trouble.";
  return `
  <div class="notice" style="border-left-color:${color};background:${bg};color:${color}">
    ${kb(r.bytes)} of code · ${r.vehicleCount} ${r.vehicleCount===1?"vehicle":"vehicles"}${r.photoCount?` · ${r.photoCount} photos`:" · no photos"}.
    ${verdict}
  </div>
  <p style="display:flex;gap:10px;flex-wrap:wrap">
    <button class="btn" data-admin="copy-embed">Copy code</button>
    <button class="btn sec" data-admin="download-embed">Download as a text file instead</button>
    <button class="linkbtn" data-admin="rebuild-embed">Rebuild</button>
  </p>
  <textarea readonly id="embedcode" style="min-height:160px;font-family:monospace;font-size:11.5px;white-space:pre" onclick="this.select()">${esc(r.code)}</textarea>
  <p class="hint" style="margin-top:6px">Click the box to select it all if the Copy button doesn't work in your browser.</p>`;
}

const MANIFEST_KEY = "lot_export_manifest_v1";
function loadManifest(){
  try{ const raw = localStorage.getItem(MANIFEST_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function saveManifest(m){ try{ localStorage.setItem(MANIFEST_KEY, JSON.stringify(m)); }catch(e){} }
function clearManifest(){ try{ localStorage.removeItem(MANIFEST_KEY); }catch(e){} }

/* Deterministic id -> desired-name map, independent of upload order, so
   re-running the export assigns the same file name to the same photo
   unless its vehicle info or SEO description actually changed. */
function buildCurrentFileMap(){
  const map = new Map();
  [...S.vehicles].sort((a,b)=> (a.id||"").localeCompare(b.id||"")).forEach(v=>{
    (v.photos||[]).forEach((p,i)=>{
      const seoBase = p.seoName ? slugify(p.seoName.replace(/\.[a-z0-9]+$/i,"")) : slugify(vehicleSlugBase(v)+"-photo-"+(i+1));
      map.set(p.id, {seoBase, name:p.name, guessType:"image/jpeg"});
    });
    (v.docs||[]).forEach(d=>{
      const seoBase = slugify(vehicleSlugBase(v)+"-"+(d.label||docKind(d.kind).short));
      map.set(d.id, {seoBase, name:d.name, guessType:d.contentType});
    });
  });
  return map;
}

function blobToDataURL(blob){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

async function buildEmbedSnippet(includePhotos){
  const log = m => { const el = document.getElementById("embedlog"); if(el) el.textContent = m; };
  const active = S.vehicles.filter(v => v.status !== "sold");
  const out = [];
  let photoCount = 0, done = 0;

  for(const v of active){
    done++;
    let photo;
    if(includePhotos && v.photos && v.photos[0]){
      log(`Preparing photo ${done} of ${active.length}…`);
      try{
        const res = await fetch(assetUrl(v.photos[0].id));
        if(res.ok){
          const shrunk = await shrinkImage(await res.blob(), 480, 0.55); // deliberately tiny — this travels as text
          photo = await blobToDataURL(shrunk);
          photoCount++;
        }
      }catch(e){ /* that one vehicle just shows no photo */ }
    }
    out.push({
      year:v.year, make:v.make, model:v.model, trim:v.trim,
      price:v.price, mileage:v.mileage, extColor:v.extColor,
      transmission:v.transmission, drivetrain:v.drivetrain,
      description:v.description, hasDocs: !!(v.docs && v.docs.length),
      photo
    });
  }

  log("Assembling the code…");
  const data = JSON.stringify({
    vehicles: out,
    settings: {
      dealerName: S.settings.dealerName, intro: S.settings.intro,
      services: S.settings.services, phone: S.settings.phone, email: S.settings.email
    }
  }).replace(/</g, "\\u003c").replace(/\u2028/g,"\\u2028").replace(/\u2029/g,"\\u2029");

  // No <!DOCTYPE>/<html>/<head>/<body> — GoDaddy's Custom Code box already
  // runs inside its own page, so this is a plain snippet the box wraps itself.
  const code =
    '<style>\n' + LITE_CSS + '\n</style>\n' +
    '<div id="li-app"></div>\n' +
    '<script>window.__LITE_DATA__ = ' + data + ';<\/script>\n' +
    '<script>\n' + LITE_JS + '\n<\/script>\n';

  return { code, bytes: new Blob([code]).size, vehicleCount: out.length, photoCount };
}

function loadJSZip(){
  return new Promise((resolve, reject)=>{
    if(window.JSZip) return resolve(window.JSZip);
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";
    s.onload = ()=> window.JSZip ? resolve(window.JSZip) : reject(new Error("missing"));
    s.onerror = ()=> reject(new Error("blocked"));
    document.head.appendChild(s);
  });
}

function extFor(type, name){
  const t = (type||"").toLowerCase();
  if(t.includes("pdf")) return "pdf";
  if(t.includes("png")) return "png";
  if(t.includes("webp")) return "webp";
  if(t.includes("gif")) return "gif";
  if(t.includes("svg")) return "svg";
  if(t.includes("jpeg")||t.includes("jpg")) return "jpg";
  const m = /\.([a-z0-9]{2,4})$/i.exec(name||"");
  return m ? m[1].toLowerCase() : "jpg";
}

async function exportSite(){
  const log = m => { const el = document.getElementById("exportlog"); if(el) el.textContent = m; };
  const btn = document.getElementById("exportbtn");
  const fullRebuild = document.getElementById("fullrebuild") ? document.getElementById("fullrebuild").checked : false;
  if(btn) btn.disabled = true;

  try{
    let ZipCtor;
    try{ ZipCtor = await loadJSZip(); }
    catch(e){ log(""); toast("Couldn't load the packaging tool. Check your connection and try again.", 5000); return; }

    const zip = new ZipCtor();
    const currentMap = buildCurrentFileMap();
    const manifest = fullRebuild ? null : loadManifest();
    const prevFiles = (manifest && manifest.files) || {};
    const isFirstBuild = !manifest || !Object.keys(prevFiles).length;

    const files = {};        // id -> final relative path (whether packed this run or reused)
    const usedNames = new Set();
    const total = currentMap.size;
    let done = 0, packed = 0, skipped = 0, missing = 0;

    for(const [id, meta] of currentMap){
      done++;
      const prevPath = prevFiles[id];
      const prevBase = prevPath ? prevPath.replace(/^assets\//,"").replace(/\.[a-z0-9]+$/i,"") : null;
      // matches exactly, or matches with a "-2"/"-3" suffix our own name-collision handling may have added
      const unchanged = !fullRebuild && prevBase && (prevBase === meta.seoBase || new RegExp("^"+meta.seoBase+"-\\d+$").test(prevBase));

      if(unchanged){
        files[id] = prevPath;
        usedNames.add(prevPath.replace(/^assets\//,""));
        skipped++;
        continue;
      }

      log(`Packing file ${done} of ${total}…`);
      try{
        const res = await fetch(assetUrl(id));
        if(!res.ok) throw new Error("fetch");
        const blob = await res.blob();
        const ext = extFor(blob.type || meta.guessType, meta.name);
        let base = meta.seoBase, name = base + "." + ext, n = 2;
        while(usedNames.has(name)){ name = base + "-" + n + "." + ext; n++; }
        usedNames.add(name);
        const path = "assets/" + name;
        zip.file(path, blob);
        files[id] = path;
        packed++;
      }catch(e){ missing++; }
    }

    /* files that existed in the previous build but aren't referenced by any
       vehicle any more, or were renamed — safe to delete from the live site */
    const currentPaths = new Set(Object.values(files));
    const obsolete = Object.entries(prevFiles)
      .filter(([id,path]) => !currentMap.has(id) || files[id] !== path)
      .map(([,path]) => path)
      .filter(path => !currentPaths.has(path));

    log("Writing the page…");
    const css = document.querySelector("style").textContent;
    const js  = document.getElementById("app-script").textContent.replace(/<\/script/gi, "<\\/script");
    const data = JSON.stringify({vehicles:S.vehicles, settings:S.settings, files})
      .replace(/</g, "\\u003c").replace(/\u2028/g,"\\u2028").replace(/\u2029/g,"\\u2029");
    const name = S.settings.dealerName || "Used vehicle inventory";

    const html =
      '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n' +
      '<title>' + esc(name) + ' — Used vehicle inventory</title>\n' +
      '<meta name="description" content="' + esc((S.settings.intro||"Used vehicles for sale, with photos and full service paperwork attached.").slice(0,180)) + '">\n' +
      (S.settings.faviconUrl ? '<link rel="icon" href="' + esc(S.settings.faviconUrl) + '">\n' : '') +
      '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
      '<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">\n' +
      '<style>\n' + css + '\n</style>\n</head>\n<body>\n<div id="app"></div>\n' +
      '<script>window.__LOT_DATA__ = ' + data + ';<\/script>\n' +
      '<script>\n' + js + '\n<\/script>\n</body>\n</html>\n';

    zip.file("index.html", html);
    zip.file("READ ME FIRST.txt", exportReadme({isFirstBuild, packed, skipped, obsolete}));

    log("Compressing…");
    const blob = await zip.generateAsync({type:"blob"});

    const dl = window.claude ? await claude.use("downloads").catch(()=>null) : null;
    if(!dl){ log(""); toast("Saving files isn't available in this view.", 5000); return; }

    log(`Ready — ${kb(blob.size)}.`);
    await dl.save({filename: isFirstBuild ? "inventory-website.zip" : "inventory-website-update.zip", data:blob});

    saveManifest({files, exportedAt: Date.now(), fileCount: Object.keys(files).length});

    if(missing) toast(`Built, but ${missing} attachment${missing>1?"s":""} couldn't be read and were left out.`, 6000);
    else if(isFirstBuild) toast("Website files saved. Unzip and upload the whole folder to your host.", 6000);
    else toast(`Saved — ${packed} file${packed===1?"":"s"} new or changed, ${skipped} unchanged and skipped. See the readme for how to merge it in.`, 7000);

    if(S.admin) render();
  }catch(e){
    const code = e && e.code;
    if(code === "declined"){ log("Cancelled."); }
    else if(code === "too_large"){ log(""); toast("That package is too large to save here. Mark some sold vehicles and try again.", 6000); }
    else { log(""); toast("The export didn't finish. Try again in a moment.", 5000); }
  }finally{
    const b = document.getElementById("exportbtn"); if(b) b.disabled = false;
  }
}

function photoGridHTML(v){
  return (v.photos||[]).map((p,i)=>`
    <div class="photocell" data-idx="${i}">
      <div class="ph">
        <button class="draghandle" data-drag="${i}" aria-label="Drag to reorder" title="Drag to reorder">⠿</button>
        <img src="${esc(assetUrl(p.id))}" alt="">
      </div>
      ${i===0?`<div class="mainflag">Main photo</div>`:""}
      <div class="seoname${p.seoPending?" pending":""}">${p.seoPending?"Naming for SEO…":esc(p.seoName||p.name||"")}</div>
      <div class="tools">
        <button data-pmove="${i}:-1" title="Move earlier">←</button>
        <button data-pmove="${i}:1" title="Move later">→</button>
        <button data-pdel="${i}" title="Remove">Remove</button>
      </div>
    </div>`).join("");
}

function wirePhotoGrid(d){
  document.querySelectorAll("#photogrid [data-pmove]").forEach(b=>b.addEventListener("click",()=>{
    const [i,dir] = b.getAttribute("data-pmove").split(":").map(Number);
    const j = i + dir; if(j<0 || j>=d.photos.length) return;
    const t = d.photos[i]; d.photos[i]=d.photos[j]; d.photos[j]=t;
    S.admin.dirty = true; refreshPhotoGrid(d);
  }));
  document.querySelectorAll("#photogrid [data-pdel]").forEach(b=>b.addEventListener("click",()=>{
    d.photos.splice(Number(b.getAttribute("data-pdel")),1); S.admin.dirty=true; refreshPhotoGrid(d);
  }));
  wirePhotoDrag(d);
}

function refreshPhotoGrid(d){
  const grid = document.getElementById("photogrid");
  if(!grid) return;
  grid.innerHTML = photoGridHTML(d);
  wirePhotoGrid(d);
  const msg = document.querySelector(".savebar .msg");
  if(msg) msg.textContent = "Unsaved changes";
}

/* pointer-based drag reorder — works for both mouse and touch */
function wirePhotoDrag(d){
  const grid = document.getElementById("photogrid");
  if(!grid) return;
  let dragIndex = null, ghost = null, lastOver = null;

  grid.querySelectorAll("[data-drag]").forEach(handle=>{
    handle.addEventListener("pointerdown", ev=>{
      ev.preventDefault();
      dragIndex = Number(handle.getAttribute("data-drag"));
      const cell = handle.closest(".photocell");
      cell.classList.add("dragging");
      const img = cell.querySelector("img");
      ghost = document.createElement("div");
      ghost.className = "dragghost";
      ghost.innerHTML = img ? `<img src="${img.src}" alt="">` : "";
      document.body.appendChild(ghost);
      positionGhost(ev.clientX, ev.clientY);
      handle.setPointerCapture(ev.pointerId);

      const onMove = mv=>{
        positionGhost(mv.clientX, mv.clientY);
        const target = document.elementFromPoint(mv.clientX, mv.clientY);
        const overCell = target && target.closest && target.closest(".photocell");
        if(lastOver && lastOver !== overCell) lastOver.classList.remove("drop-target");
        if(overCell && overCell !== cell){ overCell.classList.add("drop-target"); lastOver = overCell; }
        else lastOver = null;
      };
      const onUp = up=>{
        handle.releasePointerCapture(ev.pointerId);
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
        if(ghost){ ghost.remove(); ghost = null; }
        cell.classList.remove("dragging");
        if(lastOver){
          lastOver.classList.remove("drop-target");
          const targetIndex = Number(lastOver.getAttribute("data-idx"));
          if(targetIndex !== dragIndex){
            const [moved] = d.photos.splice(dragIndex, 1);
            d.photos.splice(targetIndex, 0, moved);
            S.admin.dirty = true;
          }
        }
        dragIndex = null; lastOver = null;
        refreshPhotoGrid(d);
      };
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp, {once:true});
    });
  });

  function positionGhost(x,y){
    if(!ghost) return;
    ghost.style.left = (x - 60) + "px";
    ghost.style.top = (y - 45) + "px";
  }
}

/* ---------- SEO filename generation ---------- */
function slugify(s){
  return String(s||"").toLowerCase()
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"")
    .slice(0,60) || "photo";
}

function vehicleSlugBase(v){
  return slugify([v.year, v.make, v.model, v.trim].filter(Boolean).join(" ")) || "used-vehicle";
}

/* Falls back to a plain descriptive name (year-make-model-color-position-n)
   when the sample capability is unavailable, declined, or fails — every
   photo still gets an SEO-friendlier name than a random id. */
function fallbackSeoName(v, index, ext){
  const parts = [v.year, v.make, v.model, v.trim, v.extColor, "photo", index+1].filter(Boolean);
  return slugify(parts.join(" ")) + "." + ext;
}

async function nameSinglePhotoWithAI(v, photo, index, blob, ext){
  if(!S.sample) return fallbackSeoName(v, index, ext);
  const base = vehicleSlugBase(v);
  const prompt = `This photo is one of several listing images for a used ${[v.year,v.make,v.model,v.trim].filter(Boolean).join(" ")||"vehicle"} for sale.
Look at the photo and identify what it shows (for example: front three-quarter view, rear view, driver's seat, dashboard and infotainment, engine bay, wheel and tire, odometer, undercarriage, cargo area, damage close-up).
Reply with ONLY 2 to 5 lowercase words separated by hyphens describing what's shown, suitable for use in an SEO-friendly image file name. No punctuation besides hyphens, no the vehicle's make/model/year (that will be added separately), no generic filler words like "photo" or "image".`;
  try{
    const res = await S.sample(prompt, {images:[blob], modelTier:"quick", cache:false});
    const words = (res.text||"").trim().toLowerCase().replace(/[^a-z0-9\s-]/g,"").split(/[\s-]+/).filter(Boolean).slice(0,5);
    const desc = words.join("-");
    return desc ? `${base}-${desc}-${index+1}.${ext}` : fallbackSeoName(v, index, ext);
  }catch(e){
    return fallbackSeoName(v, index, ext);
  }
}

/* Rename every photo currently on the draft once enough vehicle details
   exist to make the name meaningful (called after upload and after key
   fields change on save). Runs one photo at a time so a decline or a
   single failure doesn't block the rest. */
async function renameAllPhotosForSEO(d){
  if(!S.sample || !d.photos || !d.photos.length) return;
  for(let i=0;i<d.photos.length;i++){
    const p = d.photos[i];
    if(p.seoNamedFor === vehicleSlugBase(d) && p.seoName) continue; // already named for this vehicle info
    p.seoPending = true;
  }
  refreshPhotoGrid(d);
  for(let i=0;i<d.photos.length;i++){
    const p = d.photos[i];
    if(!p.seoPending) continue;
    try{
      const res = await fetch(assetUrl(p.id));
      const blob = await res.blob();
      const ext = extFor(blob.type, p.name);
      p.seoName = await nameSinglePhotoWithAI(d, p, i, blob, ext);
      p.seoNamedFor = vehicleSlugBase(d);
    }catch(e){
      p.seoName = fallbackSeoName(d, i, extFor(p.contentType, p.name));
    }finally{
      p.seoPending = false;
      refreshPhotoGrid(d);
    }
  }
}

/* ---------- admin wiring ---------- */
function wireAdmin(){
  document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{
    if(S.admin.dirty && !confirm("Leave this vehicle without saving?")) return;
    S.admin.tab = b.getAttribute("data-tab"); S.admin.draft=null; S.admin.dirty=false;
    if(S.admin.tab==="storage") refreshUsage().then(render); else render();
  }));
  document.querySelectorAll("[data-admin]").forEach(b=>b.addEventListener("click", async ()=>{
    const a = b.getAttribute("data-admin");
    if(a==="close") closeAdmin();
    if(a==="new"){ S.admin.draft = blankVehicle(); S.admin.dirty=false; render(); }
    if(a==="cancel"){
      if(S.admin.dirty && !confirm("Discard changes to this vehicle?")) return;
      S.admin.draft=null; S.admin.dirty=false; render();
    }
    if(a==="save"){ await commitVehicle(); }
    if(a==="save-site"){ await commitSite(); }
    if(a==="export"){ await exportSite(); }
    if(a==="renamephotos"){ if(S.admin.draft) renameAllPhotosForSEO(S.admin.draft); }
    if(a==="build-embed" || a==="rebuild-embed"){
      const bb = document.getElementById("embedbtn"); if(bb) bb.disabled = true;
      const includePhotos = document.getElementById("embedphotos") ? document.getElementById("embedphotos").checked : true;
      try{
        S.admin.embedResult = await buildEmbedSnippet(includePhotos);
        render();
        toast("Embed code ready. Copy it into GoDaddy's Custom HTML section.");
      }catch(e){
        toast("Couldn't build the embed code. Try again in a moment.", 5000);
      }finally{ if(bb) bb.disabled = false; }
    }
    if(a==="copy-embed" && S.admin.embedResult){
      const code = S.admin.embedResult.code;
      try{
        await navigator.clipboard.writeText(code);
        toast("Copied. Paste it into GoDaddy's Custom Code field.");
      }catch(e){
        const ta = document.getElementById("embedcode");
        if(ta){ ta.focus(); ta.select(); }
        toast("Couldn't copy automatically — the box is selected, use Ctrl/Cmd+C.", 5000);
      }
    }
    if(a==="download-embed" && S.admin.embedResult){
      const dl = window.claude ? await claude.use("downloads").catch(()=>null) : null;
      if(!dl){ toast("Saving files isn't available in this view.", 5000); }
      else{
        const blob = new Blob([S.admin.embedResult.code], {type:"text/plain"});
        try{ await dl.save({filename:"godaddy-embed-code.txt", data:blob}); toast("Saved. Open it and copy everything into GoDaddy."); }
        catch(e){ toast("Couldn't save that file. Try again.", 5000); }
      }
    }
    if(a==="reset-manifest"){
      if(confirm("Forget the last build? The next build will repack every photo and document from scratch.")){
        clearManifest(); render();
      }
    }
  }));
  document.querySelectorAll("[data-sell]").forEach(b=>b.addEventListener("click", async ()=>{
    const v = S.vehicles.find(x=>x.id===b.getAttribute("data-sell"));
    if(!v) return;
    v.status = "sold"; v.soldAt = Date.now();
    b.disabled = true;
    try{ await saveVehicle(v); toast(`${carName(v)} marked sold — now showing on the Sold Vehicles page.`); }
    catch(e){ v.status = v.status==="sold" ? "available" : v.status; toast("Couldn't update that listing. Try again."); }
    render();
  }));
  document.querySelectorAll("[data-unsell]").forEach(b=>b.addEventListener("click", async ()=>{
    const v = S.vehicles.find(x=>x.id===b.getAttribute("data-unsell"));
    if(!v) return;
    v.status = "available"; delete v.soldAt;
    b.disabled = true;
    try{ await saveVehicle(v); toast(`${carName(v)} marked available again.`); }
    catch(e){ v.status = "sold"; toast("Couldn't update that listing. Try again."); }
    render();
  }));
  document.querySelectorAll("[data-edit]").forEach(b=>b.addEventListener("click",()=>{
    const v = S.vehicles.find(x=>x.id===b.getAttribute("data-edit"));
    if(!v) return;
    S.admin.draft = JSON.parse(JSON.stringify(v)); S.admin.dirty=false; render();
  }));
  document.querySelectorAll("[data-del]").forEach(b=>b.addEventListener("click", async ()=>{
    const v = S.vehicles.find(x=>x.id===b.getAttribute("data-del"));
    if(!v) return;
    if(!confirm(`Delete ${carName(v)}? Its photos and documents stay in storage but the listing is gone.`)) return;
    try{ await deleteVehicle(v.id); toast("Listing deleted."); }
    catch(e){ toast("Couldn't delete that listing. Try again."); }
    render();
  }));

  if(!S.admin.draft){ wireSiteFields(); return; }
  const d = S.admin.draft;

  document.querySelectorAll("[data-k]").forEach(el=>{
    el.addEventListener("input", ()=>{
      const k = el.getAttribute("data-k");
      if(k==="features") d.features = el.value.split("\n").map(s=>s.trim()).filter(Boolean);
      else if(k==="price"||k==="mileage") d[k] = num(el.value);
      else d[k] = el.value;
      if(!S.admin.dirty){ S.admin.dirty = true; const m=document.querySelector(".savebar .msg"); if(m) m.textContent="Unsaved changes"; }
    });
    el.addEventListener("change", ()=>{ if(el.tagName==="SELECT"){ d[el.getAttribute("data-k")] = el.value; S.admin.dirty=true; } });
  });

  setupDrop("#photodrop", "#photoinput", files => addPhotos(d, files));
  setupDrop("#docdrop", "#docinput", files => addDocs(d, files));
  wirePhotoGrid(d);

  document.querySelectorAll("[data-ddel]").forEach(b=>b.addEventListener("click",()=>{
    d.docs.splice(Number(b.getAttribute("data-ddel")),1); S.admin.dirty=true; render();
  }));
}

function wireSiteFields(){
  document.querySelectorAll("[data-s]").forEach(el=>{
    el.addEventListener("input", ()=>{ S.settings[el.getAttribute("data-s")] = el.value; });
  });
}

function setupDrop(dropSel, inputSel, handler){
  const drop = document.querySelector(dropSel), input = document.querySelector(inputSel);
  if(!drop || !input) return;
  drop.addEventListener("click", ()=> input.click());
  input.addEventListener("change", ()=>{ if(input.files.length) handler([...input.files]); input.value=""; });
  ["dragenter","dragover"].forEach(e=>drop.addEventListener(e, ev=>{ ev.preventDefault(); drop.classList.add("over"); }));
  ["dragleave","drop"].forEach(e=>drop.addEventListener(e, ev=>{ ev.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", ev=>{
    const files = [...(ev.dataTransfer?ev.dataTransfer.files:[])];
    if(files.length) handler(files);
  });
}

async function addPhotos(d, files){
  const imgs = files.filter(f=>/^image\//.test(f.type));
  if(!imgs.length){ toast("Those aren't image files. Photos need to be JPG, PNG or WebP."); return; }
  toast(`Uploading ${imgs.length} photo${imgs.length>1?"s":""}…`, 60000);
  let ok = 0;
  for(const file of imgs){
    try{ const a = await uploadFile(file, {maxDim:2400}); d.photos.push({id:a.id, name:a.name}); ok++; }
    catch(e){ toast(UPLOAD_ERRORS[e && e.code] || `Couldn't upload ${file.name}.`, 5000); }
  }
  S.admin.dirty = true;
  render();
  if(ok) toast(`${ok} photo${ok>1?"s":""} added. Save the vehicle to publish them.`);
  if(ok && S.sample) renameAllPhotosForSEO(d);
}

async function addDocs(d, files){
  const kindEl = document.querySelector("#dockind"), labelEl = document.querySelector("#doclabel");
  const kind = kindEl ? kindEl.value : "other";
  const label = labelEl && labelEl.value.trim() ? labelEl.value.trim() : "";
  toast(`Uploading ${files.length} file${files.length>1?"s":""}…`, 60000);
  let ok = 0;
  for(const file of files){
    if(!/pdf|^image\//.test(file.type)){ toast(`${file.name} isn't a PDF or image.`, 5000); continue; }
    try{
      const a = await uploadFile(file, {maxDim:2600});
      d.docs.push({id:a.id, name:a.name, kind, label, contentType:a.contentType, size:a.size});
      ok++;
    }catch(e){ toast(UPLOAD_ERRORS[e && e.code] || `Couldn't upload ${file.name}.`, 5000); }
  }
  S.admin.dirty = true;
  render();
  if(ok) toast(`${ok} document${ok>1?"s":""} attached. Save the vehicle to publish them.`);
}

async function commitVehicle(){
  const d = S.admin.draft;
  if(!d.year && !d.make && !d.model){ toast("Give the vehicle at least a year, make or model first."); return; }
  S.admin.saving = true; render();
  try{
    await saveVehicle(d);
    S.admin.saving = false; S.admin.dirty = false; S.admin.draft = null;
    render();
    toast("Vehicle saved and live on the site.");
  }catch(e){
    S.admin.saving = false; render();
    toast(e && e.code==="invalid_argument"
      ? "That didn't save — the description may be too long, or you may not have edit access."
      : "Couldn't save right now. Try again in a moment.", 5000);
  }
}

async function commitSite(){
  try{ await saveSettings(S.settings); toast("Site details saved."); }
  catch(e){ toast("Couldn't save site details. Try again."); }
}

/* ============================ routing ============================ */
function readHash(){
  const m = /v=([A-Za-z0-9_-]+)/.exec(location.hash||"");
  if(m){ S.currentId = m[1]; S.view = "detail"; }
  else if(/^#?sold$/.test(location.hash||"")){
    S.view = "list"; S.currentId = null; S.filters = defaultFilters("sold");
  }
  else { S.view = "list"; S.currentId = null; }
}
window.addEventListener("hashchange", ()=>{ readHash(); S.photoIndex=0; S.lightbox=false; render(); });
window.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ if(S.lightbox){ exitFullscreenIfActive(); S.lightbox=false; render(); } }
  if(S.view==="detail" && !S.admin){
    if(e.key==="ArrowRight"||e.key==="ArrowLeft"){
      const v = S.vehicles.find(x=>x.id===S.currentId); const n = v && (v.photos||[]).length;
      if(n>1){ S.photoIndex = e.key==="ArrowRight" ? (S.photoIndex+1)%n : (S.photoIndex-1+n)%n; render(); }
    }
  }
});

readHash();
render();
boot();

</script>
